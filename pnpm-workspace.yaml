packages:
  - apps/*
  - libs/*

# The Zod resolver imports zod without declaring it. Pin its local copy to
# Web's existing version so the independent MCP SDK can use Zod >=4.2.
packageExtensions:
  '@hookform/resolvers@5.2.0':
    dependencies:
      zod: 4.0.10

ignoredBuiltDependencies:
  - esbuild

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - bcrypt
  - prisma
  - sharp
  - unrs-resolver
